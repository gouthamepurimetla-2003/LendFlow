<!-- trackDisbursement.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Track Disbursement Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 600px; margin-top: 40px; }
        .card { margin-top: 30px; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">Disbursement Details</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${disbursement.disbursementId}"></span></p>
            <p><strong>Application ID:</strong> <span th:text="${disbursement.applicationId}"></span></p>
            <p><strong>Company Name:</strong> <span th:text="${disbursement.application.companyName}"></span></p>
            <p><strong>Disbursed Amount:</strong> <span th:text="${disbursement.disbursedAmount}"></span></p>
            <p><strong>Date:</strong> <span th:text="${disbursement.date}"></span></p>
            <p><strong>Repayment Schedule:</strong> <span th:text="${disbursement.repaymentSchedule}"></span></p>
        </div>
    </div>
    <a href="/track" class="btn btn-secondary mt-3">Back</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
