<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Workflow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Loan Approval Workflow</h2>

    <div class="card mb-4">
        <div class="card-header">
            Approve/Reject Loan
        </div>
        <div class="card-body">
            <form id="approvalForm">
                <div class="mb-3">
                    <label for="applicationId" class="form-label">Application ID</label>
                    <input type="number" class="form-control" id="applicationId" required>
                </div>
                <div class="mb-3">
                    <label for="approverId" class="form-label">Approver ID</label>
                    <input type="number" class="form-control" id="approverId" required>
                </div>
                <div class="mb-3">
                    <label for="approvalLevel" class="form-label">Approval Level</label>
                    <input type="number" class="form-control" id="approvalLevel" required>
                </div>
                <div class="mb-3">
                    <label for="comments" class="form-label">Comments (Optional)</label>
                    <textarea class="form-control" id="comments" rows="3"></textarea>
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                    <button type="button" class="btn btn-success" id="approveBtn">Approve</button>
                    <button type="button" class="btn btn-danger" id="rejectBtn">Reject</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            View Approval Status
        </div>
        <div class="card-body">
            <form id="statusForm">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label for="viewApplicationId" class="form-label">Application ID</label>
                        <input type="number" class="form-control" id="viewApplicationId" required>
                    </div>
                    <div class="col-md-5">
                        <label for="viewApprovalLevel" class="form-label">Approval Level</label>
                        <input type="number" class="form-control" id="viewApprovalLevel" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">View</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="responseMessage" class="mt-3"></div>

    <div id="approvalStatusCard" class="card mt-4" style="display:none;">
        <div class="card-header">
            Approval Details
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>Approval ID:</strong> <span id="displayApprovalId"></span></li>
                <li class="list-group-item"><strong>Application ID:</strong> <span id="displayApplicationId"></span></li>
                <li class="list-group-item"><strong>Approver ID:</strong> <span id="displayApproverId"></span></li>
                <li class="list-group-item"><strong>Approval Level:</strong> <span id="displayApprovalLevel"></span></li>
                <li class="list-group-item"><strong>Status:</strong> <span id="displayApprovalStatus"></span></li>
                <li class="list-group-item"><strong>Date:</strong> <span id="displayApprovalDate"></span></li>
                <li class="list-group-item"><strong>Comments:</strong> <span id="displayComments"></span></li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('approveBtn').addEventListener('click', () => submitAction('approve'));
    document.getElementById('rejectBtn').addEventListener('click', () => submitAction('reject'));
    document.getElementById('statusForm').addEventListener('submit', viewStatus);

    async function submitAction(action) {
        const applicationId = document.getElementById('applicationId').value;
        const approverId = document.getElementById('approverId').value;
        const approvalLevel = document.getElementById('approvalLevel').value;
        const comments = document.getElementById('comments').value;

        if (!applicationId || !approverId || !approvalLevel) {
            showMessage('Please fill in all required fields.', 'danger');
            return;
        }

        showMessage('Processing...', 'info');

        const url = `http://localhost:8084/${action}?applicationId=${applicationId}&approverId=${approverId}&approvalLevel=${approvalLevel}&comments=${comments}`;
<!--        const url = `http://localhost:8084/api/approvals/${action}?applicationId=${applicationId}&approverId=${approverId}&approvalLevel=${approvalLevel}&comments=${comments}`;-->

        try {
            const response = await fetch(url, {
                method: 'POST'
            });

            if (response.ok) {
                const data = await response.json();
                showMessage(`Successfully ${action}d the loan.`, 'success');
<!--                displayApprovalDetails(data);-->
            } else {
                const error = await response.json();
                showMessage(`Error: ${error.message || 'Something went wrong.'}`, 'danger');
            }
        } catch (error) {
            showMessage('Network error. Check your server connection.', 'danger');
        }
    }

    async function viewStatus(event) {
        event.preventDefault();

        const applicationId = document.getElementById('viewApplicationId').value;
        const approvalLevel = document.getElementById('viewApprovalLevel').value;

        if (!applicationId || !approvalLevel) {
            showMessage('Please enter both Application ID and Approval Level.', 'danger');
            return;
        }

        showMessage('Fetching status...', 'info');

        const url = `http://localhost:8084/${applicationId}/level/${approvalLevel}`;
<!--        const url = `http://localhost:8084/api/approvals/${applicationId}/level/${approvalLevel}`;-->

        try {
            const response = await fetch(url);

            if (response.ok) {
                const data = await response.json();
                showMessage('Status retrieved successfully.', 'success');
                displayApprovalDetails(data);
            } else if (response.status === 404) {
                showMessage('No approval status found for this application and level.', 'warning');
                hideApprovalDetails();
            } else {
                showMessage('Error fetching status.', 'danger');
            }
        } catch (error) {
            showMessage('Network error. Check your server connection.', 'danger');
        }
    }

    function showMessage(message, type) {
        const messageDiv = document.getElementById('responseMessage');
        messageDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    function displayApprovalDetails(data) {
        document.getElementById('displayApprovalId').textContent = data.approvalId;
        document.getElementById('displayApplicationId').textContent = data.applicationId;
        document.getElementById('displayApproverId').textContent = data.approverId;
        document.getElementById('displayApprovalLevel').textContent = data.approvalLevel;
        document.getElementById('displayApprovalStatus').textContent = data.approvalStatus;
        document.getElementById('displayApprovalDate').textContent = new Date(data.approvalDate).toLocaleString();
        document.getElementById('displayComments').textContent = data.comments || 'N/A';
        document.getElementById('approvalStatusCard').style.display = 'block';
    }

    function hideApprovalDetails() {
        document.getElementById('approvalStatusCard').style.display = 'none';
    }
</script>
</body>
</html>
