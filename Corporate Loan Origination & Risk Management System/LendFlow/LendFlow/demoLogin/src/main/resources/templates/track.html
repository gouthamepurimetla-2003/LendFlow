<!DOCTYPE html>
<html>
<head>
    <title>Disbursement Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 600px; margin-top: 40px; }
        .result { margin-top: 30px; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">Track Disbursement</h2>
    <form action="/trackDisbursement1" method="post" class="mb-4">
        <div class="mb-3">
            <label for="applicationId1" class="form-label">Application ID</label>
            <input type="number" class="form-control" id="applicationId1" name="applicationId" required>
        </div>
        <div class="mb-3">
            <label for="companyName" class="form-label">Company Name</label>
            <input type="text" class="form-control" id="companyName" name="companyName" required>
        </div>
        <button type="submit" class="btn btn-primary">Track</button>
    </form>

    <h2 class="mb-4">View Disbursement</h2>
    <form action="/viewDisbursement" method="post">
        <div class="mb-3">
            <label for="applicationId2" class="form-label">Application ID</label>
            <input type="number" class="form-control" id="applicationId2" name="applicationId" required>
        </div>
        <button type="submit" class="btn btn-success">View</button>
    </form>

    <!-- Static placeholder for results; replace with actual data or use JS/AJAX for dynamic updates -->
    <div class="result">
        <h3>Disbursement Details</h3>
        <p>ID: [Disbursement ID]</p>
        <p>Application ID: [Application ID]</p>
        <p>Company Name: [Company Name]</p>
        <!-- Add more fields as needed -->
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
