<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-T3c6CoIAsl6E5u8q61G24D2lJ0kF5n1h5E42N5s3aI5aN5z6l2m5l5v2m5v" crossorigin="anonymous">
    <!-- Custom CSS for a modern look -->
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin-top: 5rem;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .success-icon {
            color: #28a745;
            font-size: 5rem;
        }
        .btn-custom {
            background-color: #007bff;
            border-color: #007bff;
            color: #fff;
            border-radius: 50rem;
            padding: 0.75rem 2rem;
            transition: background-color 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="mb-4">
        <svg class="success-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
        </svg>
    </div>
    <h1 class="display-4 fw-bold text-success">Application Submitted Successfully!</h1>
    <p class="lead text-secondary mt-4">
        Thank you for submitting your loan application. We have received your information and will begin our review shortly.
    </p>
    <hr class="my-4">
    <p class="text-muted">
        You can check the status of your application using the application ID provided in your confirmation email.
    </p>
    <a href="/success" class="btn btn-custom mt-3">Go to Dashboard</a>
</div>

<!-- Bootstrap JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bP4K3l8h0k6kP5z2O85dI6E4g5s6u4u6p4m5z4m5v6m2p2m5p" crossorigin="anonymous"></script>

</body>
</html>
