<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-credit {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
        }
        .status-positive {
            color: #28a745;
            font-weight: bold;
        }
        .status-negative {
            color: #dc3545;
            font-weight: bold;
        }
        .status-neutral {
            color: #ffc107;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="text-center mb-4">Credit Report</h2>

            <div class="card mb-4">
                <div class="card-body">
                    <form id="searchForm">
                        <div class="row">
                            <div class="col-md-8">
                                <label for="applicationId" class="form-label">Application ID</label>
                                <input type="number" class="form-control" id="applicationId" required>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100">Fetch Report</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="responseMessage"></div>

            <div id="creditContainer" style="display: none;">
                <h4>Credit Report for Application ID: <span id="currentApplicationId"></span></h4>
                <div id="creditReport"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('searchForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const applicationId = document.getElementById('applicationId').value;
        const responseMessage = document.getElementById('responseMessage');
        const creditContainer = document.getElementById('creditContainer');
        const creditReport = document.getElementById('creditReport');
        const currentApplicationId = document.getElementById('currentApplicationId');

        if (!applicationId) {
            responseMessage.innerHTML = '<div class="alert alert-warning">Please enter an Application ID</div>';
            return;
        }

        try {
            responseMessage.innerHTML = '<div class="alert alert-info">Fetching credit score...</div>';
            creditContainer.style.display = 'none';

            // Corrected URL for fetching a single report (e.g., credit score)
            const response = await fetch(`http://localhost:8084/api/credit/${applicationId}`, {
                method: 'POST'
            });

            if (response.ok) {
                const report = await response.json();
                responseMessage.innerHTML = '';
                currentApplicationId.textContent = applicationId;
                creditContainer.style.display = 'block';

                const statusClass = report.creditScore >= 750 ? 'status-positive' :
                                   report.creditScore >= 300 ? 'status-neutral' : 'status-negative';
                const statusText = report.creditScore >= 750 ? 'Good' :
                                   report.creditScore >= 300 ? 'Fair' : 'Poor';

                const reportHTML = `
                    <div class="card-credit">
                        <div class="row">
                            <div class="col-md-6">
                                <strong>Credit Score:</strong>
                                <br>
                                <span class="${statusClass}">${report.creditScore}</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Risk Score:</strong>
                                <br>
                                <button class="btn btn-secondary btn-sm" id="riskScoreBtn" data-application-id="${applicationId}">Get Risk Score</button>
                                <span id="riskScoreDisplay"></span>
                            </div>
                        </div>
                        <hr>
                        <h5>Evaluation Details</h5>
                        <ul>
                            <li><strong>Evaluation Date:</strong> ${new Date(report.evaluationDate).toLocaleDateString()}</li>
                            <li><strong>Credit Score Status:</strong> <span class="${statusClass}">${statusText}</span></li>
                        </ul>
                    </div>
                `;

                creditReport.innerHTML = reportHTML;

                // Add event listener to the new button
                document.getElementById('riskScoreBtn').addEventListener('click', fetchRiskScore);

            } else {
                responseMessage.innerHTML = '<div class="alert alert-danger">Error fetching credit score. Please try again.</div>';
            }
        } catch (error) {
            console.error('Error:', error);
            responseMessage.innerHTML = '<div class="alert alert-danger">Network error. Please check your connection and try again.</div>';
        }
    });

    async function fetchRiskScore(e) {
        const applicationId = e.target.getAttribute('data-application-id');
        const riskScoreDisplay = document.getElementById('riskScoreDisplay');
        const riskScoreBtn = document.getElementById('riskScoreBtn');

        riskScoreBtn.disabled = true;
        riskScoreBtn.textContent = 'Fetching...';

        try {
            // New API endpoint to retrieve only the risk score
            const response = await fetch(`http://localhost:8084/api/riskScore/${applicationId}`);

            if (response.ok) {
              const riskScore = parseFloat(await response.text());


                const riskStatusClass = riskScore <= 5 ? 'status-positive' :
                                        riskScore <= 7 ? 'status-neutral' : 'status-negative';
                const riskStatusText = riskScore <= 5 ? 'Low Risk' :
                                       riskScore <= 7 ? 'Medium Risk' : 'High Risk';

                riskScoreDisplay.innerHTML = `
                    <span class="${riskStatusClass}">
                        ${riskScore.toFixed(2)}
                    </span>
                    <br>
                    <span class="${riskStatusClass}">
                        ${riskStatusText}
                    </span>
                `;
                riskScoreBtn.style.display = 'none';

            } else {
                riskScoreDisplay.innerHTML = '<span class="status-negative">Error</span>';
            }
        } catch (error) {
            console.error('Error:', error);
            riskScoreDisplay.innerHTML = '<span class="status-negative">Network Error</span>';
        }
        riskScoreBtn.disabled = false;
        riskScoreBtn.textContent = 'Get Risk Score';
    }
</script>
</body>
</html>
