<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Failed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }
    .container {
        max-width: 500px;
    }
    .alert-danger {
        font-size: 1.25rem;
        font-weight: 600;
    }
    .btn-primary {
        margin-top: 1rem;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="alert alert-danger" role="alert">
    Login Failed!
  </div>
  <p>Invalid username or password. Please try again.</p>
  <a href="/approverLogin" class="btn btn-primary btn-lg">Login Again</a>
</div>
</body>
</html>
