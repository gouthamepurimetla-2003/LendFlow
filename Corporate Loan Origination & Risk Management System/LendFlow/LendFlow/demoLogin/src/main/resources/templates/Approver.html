<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBLOS - Approver Login</title>
    <!-- Use the Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
        }
        .login-card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 76px); /* Adjust height to account for the navbar */
            padding-top: 20px;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 1rem;
            padding: 3rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #2563eb;
        }
        .btn-primary {
            background-color: #2563eb;
            border-color: #2563eb;
            font-weight: 600;
            border-radius: 9999px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<!-- Header with Home Button -->
<header class="bg-white shadow-sm sticky-top">
    <nav class="navbar navbar-light container-fluid">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand h1 fw-bold text-blue-600 mb-0" href="#">CBLOS</a>
            <a class="nav-link fw-bold text-blue-600" aria-current="page" href="/home1">Home</a>
        </div>
    </nav>
</header>

<div class="login-card-container">
    <div class="card login-card text-center">
        <div class="card-body">
            <h1 class="card-title">CBLOS - Approver Login</h1>
            <form action="/api/documents/login" method="POST">
                <div class="mb-3">
                    <label for="approver-id" class="form-label">Approver ID</label>
                    <input type="text" class="form-control form-control-lg" id="approver-id" name="approver_id" placeholder="Enter your Approver ID" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
                </div>
<!--                <a href="/login">-->
                <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
<!--                </a>-->
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS CDN (Optional, for components that require JS like dropdowns) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
